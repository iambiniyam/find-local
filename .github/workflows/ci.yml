name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv
      - run: uv pip install -e ".[dev,browser]"
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
