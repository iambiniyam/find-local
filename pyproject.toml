[project]
name = "find-local"
version = "0.2.7"
description = "Offline semantic search for files, photos, and PDFs. Search your computer by describing what is in it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biniyam Gashaw" }]
keywords = ["semantic-search", "local-first", "embeddings", "clip", "mcp", "privacy", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.4",
  "pymupdf>=1.24",
  "typer>=0.12",
  "rich>=13.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "torch>=2.4", "torchvision>=0.19", "transformers>=4.51"]
ocr = ["rapidocr-onnxruntime>=1.3"]
mcp = ["mcp>=1.2"]
browser = ["playwright>=1.49"]
dev = ["pytest>=8.3", "httpx2", "ruff>=0.6"]

[project.scripts]
find-local = "find_local.cli:app"

[project.urls]
Homepage = "https://github.com/iambiniyam/find-local"
Repository = "https://github.com/iambiniyam/find-local"
Issues = "https://github.com/iambiniyam/find-local/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/find_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
